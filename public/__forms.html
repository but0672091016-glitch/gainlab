<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>GainLab forms</title>
  </head>
  <body>
    <form name="gainlab-order" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="gainlab-order" />
      <input type="hidden" name="subject" />
      <input name="bot-field" />
      <input name="customerName" />
      <input name="phone" />
      <input name="email" />
      <input name="city" />
      <input name="delivery" />
      <input name="comment" />
      <input name="itemCount" />
      <textarea name="orderItems"></textarea>
      <input name="orderTotal" />
      <input name="dataConsent" />
    </form>
  </body>
</html>
