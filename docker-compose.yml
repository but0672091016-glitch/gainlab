services:
  postgres:
    image: postgres:17-alpine
    container_name: gainlab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gainlab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gainlab_local_password}
      POSTGRES_DB: ${POSTGRES_DB:-gainlab}
    ports:
      - "5432:5432"
    volumes:
      - gainlab_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gainlab} -d ${POSTGRES_DB:-gainlab}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  gainlab_postgres_data:
